<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background Chassis Gradient -->
    <linearGradient id="chassis-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#282c35" />
      <stop offset="40%" stop-color="#1c1f26" />
      <stop offset="100%" stop-color="#101216" />
    </linearGradient>

    <!-- Edge Chamfer Gradient -->
    <linearGradient id="edge-chamfer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5a6375" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#2c323d" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06070a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Metal Center Knob Gradients -->
    <radialGradient id="knob-outer-ring" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#555d6e" />
      <stop offset="60%" stop-color="#2b303a" />
      <stop offset="100%" stop-color="#14171d" />
    </radialGradient>

    <radialGradient id="knob-core" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#c5cdd9" />
      <stop offset="65%" stop-color="#5e6778" />
      <stop offset="100%" stop-color="#262b34" />
    </radialGradient>

    <radialGradient id="lens-diode" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ff8566" />
      <stop offset="40%" stop-color="#ff3b19" />
      <stop offset="85%" stop-color="#b81600" />
      <stop offset="100%" stop-color="#4a0800" />
    </radialGradient>

    <!-- Needle Gradient -->
    <linearGradient id="needle-body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4422" />
      <stop offset="50%" stop-color="#d91c04" />
      <stop offset="100%" stop-color="#a81200" />
    </linearGradient>

    <linearGradient id="needle-highlight-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb8a3" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d9240b" stop-opacity="0.2" />
    </linearGradient>

    <!-- Segment Gradients -->
    <linearGradient id="seg-grad-0" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4ede4" />
      <stop offset="100%" stop-color="#ded5c8" />
    </linearGradient>
    <linearGradient id="seg-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4ede4" />
      <stop offset="100%" stop-color="#ded5c8" />
    </linearGradient>
    <linearGradient id="seg-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4ede4" />
      <stop offset="100%" stop-color="#ded5c8" />
    </linearGradient>
    <linearGradient id="seg-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e83820" />
      <stop offset="100%" stop-color="#bf1c08" />
    </linearGradient>
    <linearGradient id="seg-grad-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2e36" />
      <stop offset="100%" stop-color="#1c1f24" />
    </linearGradient>

    <!-- Drop Shadow Filters -->
    <filter id="chassis-drop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="block-drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="needle-drop" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="5" dy="14" stdDeviation="10" flood-color="#020305" flood-opacity="0.75" />
    </filter>

    <filter id="laser-spot-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="text-deboss-filter">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="-2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <clipPath id="squircle-shape">
      <rect x="36" y="36" width="952" height="952" rx="216" />
    </clipPath>
  </defs>

  <!-- Chassis Body -->
  <g filter="url(#chassis-drop)">
    <rect x="36" y="36" width="952" height="952" rx="216" fill="url(#chassis-grad)" />
    <rect x="37.5" y="37.5" width="949" height="949" rx="214.5" fill="none" stroke="url(#edge-chamfer)" stroke-width="3.5" />
  </g>

  <!-- Clipped Chassis Internal Plate -->
  <g clip-path="url(#squircle-shape)">
    <!-- Top Diffused Ambient Lighting -->
    <ellipse cx="512" cy="130" rx="440" ry="180" fill="#ffffff" fill-opacity="0.035" />

    <!-- Recessed Semicircular Bed Trench -->
    <path d="M 128.00 510.00 A 384.00 384.00 0 0 1 896.00 510.00 L 718.00 510.00 A 206.00 206.00 0 0 0 306.00 510.00 Z" fill="#090b0e" fill-opacity="0.85" />
    <path d="M 128.00 510.00 A 384.00 384.00 0 0 1 896.00 510.00 L 718.00 510.00 A 206.00 206.00 0 0 0 306.00 510.00 Z" fill="none" stroke="#000000" stroke-width="3" opacity="0.7" />

    <!-- 5 Segment Blocks -->
    <g id="meter-segments" filter="url(#block-drop)">
      <path id="segment-0" d="M 142.00 510.00 A 370.00 370.00 0 0 1 202.11 307.83 L 327.74 389.79 A 220.00 220.00 0 0 0 292.00 510.00 Z" fill="url(#seg-grad-0)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" />
      <path id="segment-1" d="M 215.42 288.78 A 370.00 370.00 0 0 1 384.48 162.67 L 436.18 303.48 A 220.00 220.00 0 0 0 335.66 378.46 Z" fill="url(#seg-grad-1)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" />
      <path id="segment-2" d="M 406.54 155.35 A 370.00 370.00 0 0 1 617.46 155.35 L 574.70 299.13 A 220.00 220.00 0 0 0 449.30 299.13 Z" fill="url(#seg-grad-2)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" />
      <path id="segment-3" d="M 639.52 162.67 A 370.00 370.00 0 0 1 808.58 288.78 L 688.34 378.46 A 220.00 220.00 0 0 0 587.82 303.48 Z" fill="url(#seg-grad-3)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" />
      <path id="segment-4" d="M 821.89 307.83 A 370.00 370.00 0 0 1 882.00 510.00 L 732.00 510.00 A 220.00 220.00 0 0 0 696.26 389.79 Z" fill="url(#seg-grad-4)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2" />
    </g>

    <!-- Laser Spot at Needle Tip Target (4th Segment) -->
    <g filter="url(#laser-spot-glow)">
      <circle cx="804.58" cy="327.18" r="14" fill="#ffffff" fill-opacity="0.95" />
      <circle cx="804.58" cy="327.18" r="30" fill="#ff3314" fill-opacity="0.45" />
    </g>

    <!-- Pointer Needle -->
    <g id="needle-group">
      <!-- Shadow -->
      <path d="M 497.16 486.25 L 800.60 320.82 A 7.50 7.50 0 0 1 808.55 333.54 L 526.84 533.75 Z" fill="#000000" filter="url(#needle-drop)" />
      <!-- Needle Body -->
      <path d="M 497.16 486.25 L 800.60 320.82 A 7.50 7.50 0 0 1 808.55 333.54 L 526.84 533.75 Z" fill="url(#needle-body-grad)" />
      <path d="M 497.16 486.25 L 800.60 320.82 A 7.50 7.50 0 0 1 808.55 333.54 L 526.84 533.75 Z" fill="none" stroke="url(#needle-highlight-stroke)" stroke-width="2.5" />
      <!-- Longitudinal Center Ridge Line -->
      <line x1="512" y1="510" x2="804.58" y2="327.18" stroke="#ffccbd" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    </g>

    <!-- Center Pivot Knob Assembly -->
    <g id="center-pivot-hardware" filter="url(#block-drop)">
      <!-- Outer Socket -->
      <circle cx="512" cy="510" r="98" fill="#0b0d10" stroke="#252932" stroke-width="3.5" />
      <!-- Precision Milled Bezel -->
      <circle cx="512" cy="510" r="86" fill="url(#knob-outer-ring)" stroke="#414856" stroke-width="2" />
      <!-- Turned Metal Face -->
      <circle cx="512" cy="510" r="70" fill="url(#knob-core)" />
      <!-- Concentric Micro Groove -->
      <circle cx="512" cy="510" r="58" fill="none" stroke="#262b34" stroke-width="2" opacity="0.6" />
      <!-- Laser Emitter / Diode Optical Bead -->
      <circle cx="512" cy="510" r="46" fill="#090a0d" stroke="#2c313a" stroke-width="2" />
      <circle cx="509" cy="507" r="36" fill="url(#lens-diode)" filter="url(#laser-spot-glow)" />
      <circle cx="505" cy="503" r="5.5" fill="#ffffff" fill-opacity="0.85" />
    </g>

    <!-- Bottom POWER Typography (Debossed Precision Lab Plate) -->
    <g id="power-brand" filter="url(#text-deboss-filter)">
      <text x="512" y="785" 
            text-anchor="middle" 
            font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Helvetica Neue', 'Arial Black', sans-serif" 
            font-size="96" 
            font-weight="900" 
            letter-spacing="14" 
            fill="#7b8494">POWER</text>
    </g>
  </g>
</svg>
