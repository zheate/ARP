name: Temporary frontend review environment
on:
  push:
    branches: [audit/arp-ui-20260914]
    paths: ['.github/workflows/audit-environment.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tauri-ui/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: tauri-ui
      - run: tar -czf /tmp/arp-frontend-dependencies.tar.gz -C tauri-ui node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: arp-frontend-review-dependencies
          path: /tmp/arp-frontend-dependencies.tar.gz
          retention-days: 1
