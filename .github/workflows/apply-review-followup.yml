name: Apply final presentation review
on:
  push:
    branches: [audit/arp-ui-final-20260914]
    paths: ['.github/workflows/apply-review-followup.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'zheate/ARP' && github.ref == 'refs/heads/audit/arp-ui-final-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Correct presentation sources only
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          function edit(path, pairs) {
            let text=readFileSync(path,'utf8');
            for(const [from,to] of pairs){if(text.split(from).length!==2)throw Error('Ambiguous edit: '+path+' '+from);text=text.replace(from,to);}
            writeFileSync(path,text);
          }
          edit('tauri-ui/src/App.tsx',[
            ['设备已进入断电保护状态','保护已触发；请核对下电结果与电源实体面板'],
            ['本地 JSONL 已保存 · {exportLabel}','{journalPath ? "本地记录路径已提供" : "本地记录路径未提供"} · {exportLabel}'],
            ['currentA={psu?.activeCurrentA ?? config.setCurrentA}','currentA={psu?.connected ? (config.powerSupplyKind === "ch341" ? psu.activeCurrentA : psu.outputCurrentA) : null}']
          ]);
          edit('tauri-ui/src/components/save-script-dialog.tsx',[
            ['const handleKey = (event: KeyboardEvent) => {','const handleKey = (event: KeyboardEvent) => {\n      if (event.defaultPrevented) return']
          ]);
          NODE
      - name: Test and build exact edited source
        working-directory: tauri-ui
        run: |
          mkdir -p ../qa-evidence
          set -o pipefail
          npm ci --no-audit --no-fund
          npm test 2>&1 | tee ../qa-evidence/tests.txt
          npm run build 2>&1 | tee ../qa-evidence/build.txt
      - name: Commit only presentation fixes
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/audit/arp-ui-final-20260914 | cut -f1)" = "$EXPECTED_HEAD"
          git add tauri-ui/src/App.tsx tauri-ui/src/components/save-script-dialog.tsx
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): distinguish measured current and verified safety or persistence status'
          git push origin HEAD:refs/heads/audit/arp-ui-final-20260914
          git rev-parse HEAD > qa-evidence/commit.txt
      - name: Install isolated QA browser
        run: |
          npm install --prefix /tmp/arp-playwright --no-package-lock --no-audit --no-fund playwright@1.56.1
          node /tmp/arp-playwright/node_modules/playwright/cli.js install --with-deps chromium
      - name: Recheck workspaces and real safety dialog fixtures
        working-directory: tauri-ui
        env:
          ARP_PLAYWRIGHT_MODULE: /tmp/arp-playwright/node_modules/playwright/index.mjs
          ARP_UI_QA_ASSERT: '1'
        run: |
          set -o pipefail
          npm run preview -- --host 127.0.0.1 --port 1420 > ../qa-evidence/preview.txt 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:1420/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/ui-audit.mjs 2>&1 | tee ../qa-evidence/capture.txt
          node scripts/ui-dialog-qa.mjs 2>&1 | tee ../qa-evidence/dialog-checks.txt
      - name: Archive reviewed source without assets or dependencies
        if: always()
        run: |
          mkdir -p qa-evidence
          tar --exclude='*.woff*' --exclude='*.ttf' --exclude='*.otf' -czf qa-evidence/review-source.tar.gz tauri-ui/src tauri-ui/scripts tauri-ui/tsconfig*.json tauri-ui/package*.json DESIGN.md design-qa.md
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arp-ui-safety-qa-${{ github.sha }}
          path: qa-evidence/
          retention-days: 7
