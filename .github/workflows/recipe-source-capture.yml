name: Recipe source review capture
on:
  push:
    branches: [refactor/test-platform-process-model]
    paths: [.github/workflows/recipe-source-capture.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0b6f46ac92ffcb880ad8a140fade4b997f2cf926
          persist-credentials: false
      - name: Archive tracked review sources only; do not execute application
        run: |
          mkdir -p /tmp/arp-source-review
          python - <<'PY'
          import hashlib, json, pathlib, subprocess, tarfile
          root = pathlib.Path.cwd()
          paths = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          roots = {'combined_test', 'tauri_bridge', 'tests', 'tools', 'scripts', 'packaging', 'rust-realtime-core', 'tauri-ui', 'docs', '.github'}
          suffixes = {'.py', '.pyi', '.md', '.json', '.toml', '.lock', '.txt', '.yml', '.yaml', '.ts', '.tsx', '.css', '.rs', '.mjs', '.js', '.cjs', '.csv', '.ps1', '.sh', '.spec', '.bat', '.html'}
          selected = [p for p in paths if p and (len(pathlib.PurePosixPath(p).parts) == 1 or pathlib.PurePosixPath(p).parts[0] in roots) and (pathlib.Path(p).suffix in suffixes or pathlib.Path(p).name == '.gitignore') and not any(x in pathlib.PurePosixPath(p).parts for x in ('node_modules', 'target', 'dist', 'assets', 'icons', 'fonts', '.license'))]
          out = pathlib.Path('/tmp/arp-source-review')
          with tarfile.open(out / 'source.tar.gz', 'w:gz') as archive:
              for p in selected: archive.add(root / p, arcname=p, recursive=False)
          (out / 'manifest.json').write_text(json.dumps({'ref':'0b6f46ac92ffcb880ad8a140fade4b997f2cf926','files': {p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in selected}}, indent=2))
          (out / 'tree.txt').write_bytes(subprocess.check_output(['git', 'ls-tree', '-r', 'HEAD']))
          print('Archived', len(selected), 'source files; no application execution')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arp-recipe-source-0b6f46a
          path: /tmp/arp-source-review/
          retention-days: 3
