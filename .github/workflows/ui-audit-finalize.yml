name: Apply final audited dialog fixes
on:
  push:
    branches: [ui/arp-instrument-audit-20260914]
    paths: ['.github/workflows/ui-audit-finalize.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'zheate/ARP' && github.ref == 'refs/heads/ui/arp-instrument-audit-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact frontend-only changes
        shell: python
        run: |
          from pathlib import Path
          for path, old, new in [
              ('tauri-ui/src/App.tsx', '设备已进入断电保护状态', '保护已触发；请核对电源实际输出状态'),
              ('tauri-ui/src/components/save-script-dialog.tsx', 'const handleKey = (event: KeyboardEvent) => {', 'const handleKey = (event: KeyboardEvent) => {\n      if (event.defaultPrevented) return'),
          ]:
              p = Path(path)
              s = p.read_text()
              assert s.count(old) == 1, (path, old)
              p.write_text(s.replace(old, new))
      - name: Check existing frontend contracts
        working-directory: tauri-ui
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Commit only audited files and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/ui-audit-finalize.yml
          git add tauri-ui/src/App.tsx tauri-ui/src/components/save-script-dialog.tsx
          git diff --cached --check
          git commit -m 'fix(ui): avoid unverified shutdown claims and duplicate modal focus wrapping'
          git push origin HEAD:refs/heads/ui/arp-instrument-audit-20260914
