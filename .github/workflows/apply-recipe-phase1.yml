name: Apply verified recipe Phase 1 integration
on:
  push:
    branches: [refactor/test-platform-process-model]
    paths: [.github/workflows/apply-recipe-phase1.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'zheate/ARP' && github.ref == 'refs/heads/refactor/test-platform-process-model'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply reviewed data-only patch with preimage and postimage checks
        run: |
          mkdir -p /tmp/recipe-apply-evidence
          python - <<'PY'
          import base64, hashlib, json, pathlib, subprocess, zlib
          # Temporary transport for a reviewed unified diff and test source;
          # never a product recipe interpreter. No decoded code is executed here.
          encoded = ''
          data = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(data).hexdigest() == 'a070cb78fd949d7503adc4c7073b1697d7dda3e2dabd6dcd0a2fea50d9967b3c'
          payload = json.loads(data)
          expected = {'tauri_bridge/station_automatic.py': ('7a6bfe6474b8c8d10052c3daf400c5dc3aebac600d2f9211a5aeee8f5df512ac','3aceb16bae52294c81733518605a8c4744c1f99de79deec92e896ca68a634d07'), 'tauri_bridge/station_support.py': ('7da7c265be2a6ea06c1fac9df06db90c88570159d45b92baf7675e142984516a','83d9485a666eb6a72a49973218be20603feae65c4122affc9bc87793d7bc293a'), 'tauri_bridge/snapshot_builder.py': ('f0ecac251ca430aa7ce653701d2ea30d9b75e3b77699c12e7820b722d1ab1d37','cdbdc3a75bdf297b59d677747188b3273fa10f3f682ada7afd88c7d2070d9d9e')}
          for name, hashes in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == hashes[0], name
          patch = payload['patch'].encode()
          subprocess.run(['git','apply','--check','-'], input=patch, check=True)
          subprocess.run(['git','apply','-'], input=patch, check=True)
          for name, hashes in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == hashes[1], name
          assert set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()) == set(expected)
          target = pathlib.Path('tests/test_recipe_integration.py')
          assert not target.exists()
          target.write_text(payload['test'], encoding='utf-8')
          assert hashlib.sha256(target.read_bytes()).hexdigest() == 'fee8a4409028ecd1242e7d7000071e3a4059343ee8c7a1dc37eaee32fbae1768'
          pathlib.Path('/tmp/recipe-apply-evidence/runtime.patch').write_bytes(patch)
          PY
      - name: Install existing portable test dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          names = {'numpy','scipy','openpyxl','xlsxwriter','matplotlib','pyvisa','pillow'}
          requirements = [s for s in pathlib.Path('requirements-runtime.txt').read_text().splitlines() if '==' in s and s.split('==')[0].lower() in names]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *requirements], check=True)
          PY
      - name: Full hardware-free Python regression before committing
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/recipe-apply-evidence/tests.log
      - name: Commit only the tested runtime integration and its regression tests
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/refactor/test-platform-process-model | cut -f1)" = "$EXPECTED_HEAD"
          git add tauri_bridge/station_automatic.py tauri_bridge/station_support.py tauri_bridge/snapshot_builder.py tests/test_recipe_integration.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(recipes): resolve test intent through typed profiles without changing safety or persistence'
          git rev-parse HEAD > /tmp/recipe-apply-evidence/commit.txt
          git push origin HEAD:refs/heads/refactor/test-platform-process-model
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recipe-phase1-integration-${{ github.sha }}
          path: /tmp/recipe-apply-evidence/
          retention-days: 14
