name: Apply reviewed recipe trace consumption
on:
  push:
    branches: [refactor/test-platform-process-model]
    paths: ['.github/workflows/apply-recipe-trace-consumption.yml']
permissions:
  contents: read
jobs:
  apply-reviewed-patch:
    if: github.repository == 'zheate/ARP' && github.ref == 'refs/heads/refactor/test-platform-process-model'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exactly reviewed source edit
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          path = Path('tauri_bridge/station_automatic.py')
          data = path.read_bytes()
          expected = '3aceb16bae52294c81733518605a8c4744c1f99de79deec92e896ca68a634d07'
          if hashlib.sha256(data).hexdigest() != expected:
              raise RuntimeError('Source changed; refusing to overwrite concurrent work')
          source = data.decode('utf-8')
          pairs = [
              ('    MEASURED_POINT_MEASUREMENTS,\n', ''),
              ('    stability_profile_for_legacy_id,\n', '    stability_profile_for_legacy_id,\n    template_for_legacy_id,\n'),
              ('        if self.power_supply_kind != "tdk" or not MEASURED_POINT_MEASUREMENTS.requests_second_trace(\n            current_plan_mode=settings.current_plan_mode\n        ):\n            return workbook_path\n',
               '        if self.power_supply_kind != "tdk":\n            return workbook_path\n        measurement_plan = template_for_legacy_id(\n            self.configuration.get("selectedScriptId", "standard")\n        ).measurement_plan\n        if not measurement_plan.requests_second_trace(\n            current_plan_mode=settings.current_plan_mode\n        ):\n            return workbook_path\n'),
          ]
          for old, new in pairs:
              if source.count(old) != 1:
                  raise RuntimeError('Non-unique patch context')
              source = source.replace(old, new)
          result = source.encode('utf-8')
          if hashlib.sha256(result).hexdigest() != 'cbb98b570c0b4b842f9d41aad58053dd2c652dbf5a794cf514b55ac97947f986':
              raise RuntimeError('Unexpected postimage')
          path.write_bytes(result)
          PY
      - name: Install existing portable test requirements
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys
          names = {'numpy', 'scipy', 'openpyxl', 'xlsxwriter', 'matplotlib', 'pyvisa', 'pillow'}
          requirements = [line for line in pathlib.Path('requirements-runtime.txt').read_text().splitlines() if '==' in line and line.split('==')[0].lower() in names]
          subprocess.run([sys.executable, '-m', 'pip', 'install', *requirements], check=True)
          PY
      - name: Full hardware-free Python regression before committing
        run: |
          set -o pipefail
          mkdir -p /tmp/recipe-trace-evidence
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/recipe-trace-evidence/tests.log
          sha256sum tauri_bridge/station_automatic.py tests/test_recipe_trace_integration.py > /tmp/recipe-trace-evidence/source-sha256.txt
      - name: Commit verified product fix and remove this one-shot workflow
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/refactor/test-platform-process-model | cut -f1)" = "$EXPECTED_HEAD"
          git rm .github/workflows/apply-recipe-trace-consumption.yml
          git add tauri_bridge/station_automatic.py
          git diff --cached --check
          python - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          assert paths == {'tauri_bridge/station_automatic.py', '.github/workflows/apply-recipe-trace-consumption.yml'}, paths
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(recipes): consume selected trace intent without relaxing device guards'
          git push origin HEAD:refs/heads/refactor/test-platform-process-model
          git rev-parse HEAD > /tmp/recipe-trace-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recipe-trace-consumption-${{ github.sha }}
          path: /tmp/recipe-trace-evidence/
          retention-days: 14
