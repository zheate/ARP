name: Apply screenshot review findings
on:
  push:
    branches: [audit/arp-ui-20260914]
    paths: ['.github/workflows/apply-visual-findings.yml']
permissions:
  contents: read
jobs:
  apply:
    if: github.repository == 'zheate/ARP' && github.ref == 'refs/heads/audit/arp-ui-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply exact, hash-checked frontend edits
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const gitHash = text => { const b=Buffer.from(text); return createHash('sha1').update(Buffer.from(`blob ${b.length}\0`)).update(b).digest('hex'); };
          function edit(path, hash, pairs) {
            let text=readFileSync(path,'utf8');
            if(hash && gitHash(text)!==hash) throw new Error('Source changed: '+path);
            for(const [from,to] of pairs){ if(text.split(from).length!==2) throw new Error('Ambiguous edit: '+path+' '+from); text=text.replace(from,to); }
            writeFileSync(path,text); console.log(path,gitHash(text));
          }
          edit('tauri-ui/src/index.css','895dcdc599c4bc92fd79d3bc4865d27ebb540a57',[
            ['  .pd-settings-grid > .col-span-2 {','  .pd-settings-grid > .col-span-2,\n  .pd-settings-grid > fieldset > .col-span-2 {']
          ]);
          edit('tauri-ui/src/workbench-appearance.css','9d6d63abbf37348897d1c1c63ecde8f6c1cee3f4',[
            ['auto minmax(21rem, 1.05fr)','auto minmax(22.5rem, 1.05fr)'],
            ['auto minmax(21rem, 1fr)','auto minmax(22.5rem, 1fr)'],
            ['width: 100%; flex-direction: column; gap: 0.25rem;','width: 100%; grid-template-columns: minmax(0, 1fr); gap: 0.25rem;']
          ]);
          edit('tauri-ui/src/App.tsx','c5a7da7a2e470954ea6b45eeffee7202d4762523',[
            ['<fieldset className="contents" disabled=','<fieldset aria-label="PD 采集参数" className="contents" disabled=']
          ]);
          edit('tauri-ui/scripts/workbench-ui.test.mjs','0e9dd55993db72d45a285847e6ff508ea8a239a6',[
            [`const fieldset = html.indexOf('<fieldset class="contents" disabled=""')`,String.raw`const fieldset = html.search(/<fieldset\b[^>]*\bdisabled=""/)`]
          ]);
          edit('tauri-ui/scripts/ui-review.mjs',null,[
            ['if(dpr===1 && width!==2560){\n   const spectrum','if(dpr===1){\n   const spectrum'],
            ['spectrum.rect.height>=180','spectrum.rect.height>=(height>=1000?320:180)'],
            ['const original=readout.innerHTML;','const original=[...readout.childNodes];'],
            ['readout.innerHTML=original;','readout.replaceChildren(...original);'],
            ['check(`${key}-pd-action-visible`,action && action.y>=0 && action.y+action.height<=height,action);',`check(\`\${key}-pd-action-visible\`,action && action.y>=0 && action.y+action.height<=height,action);
              const fields=await page.locator('.pd-settings-grid .pd-inline-field').evaluateAll(elements=>elements.map(e=>{
                const r=e.getBoundingClientRect();const label=e.querySelector('label');const lr=label?.getBoundingClientRect();
                return {label:label?.textContent,x:r.x,y:r.y,right:r.right,bottom:r.bottom,width:r.width,labelRight:lr?.right};
              }));
              const overlap=fields.some((a,i)=>fields.some((b,j)=>j>i && Math.min(a.right,b.right)-Math.max(a.x,b.x)>1 && Math.min(a.bottom,b.bottom)-Math.max(a.y,b.y)>1));
              check(\`\${key}-pd-fields-fit-without-overlap\`,fields.length>=6 && fields.every(f=>f.width>=160 && f.labelRight<=f.right+1) && !overlap,fields);`]
          ]);
          NODE
      - name: Test exact edited source before committing
        working-directory: tauri-ui
        run: |
          node --check scripts/ui-review.mjs
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Commit only presentation and test changes to audit branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/audit/arp-ui-20260914 | cut -f1)" = "$EXPECTED_HEAD"
          git add tauri-ui/src/App.tsx tauri-ui/src/index.css tauri-ui/src/workbench-appearance.css tauri-ui/scripts/workbench-ui.test.mjs tauri-ui/scripts/ui-review.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(ui): correct PD container-query spans and reserve sufficient spectrum height'
          git push origin HEAD:refs/heads/audit/arp-ui-20260914
