<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARP · 曲线末端样式</title>
<link rel="icon" href="data:,">
<style>
:root{color-scheme:light;--page:#f3f5f4;--card:#fff;--ink:#202a27;--muted:#75807b;--line:#e1e7e3;--grid:#edf1ee;--accent:#3b8768;--chip:#edf4ef;--shadow:0 3px 16px #192d2210;--radius:18px;--gap:18px;--pad:22px;--font: -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
:root[data-theme=dark]{color-scheme:dark;--page:#141b18;--card:#1c2520;--ink:#edf3ef;--muted:#9aa99f;--line:#34423a;--grid:#2a352e;--accent:#84c6a0;--chip:#293c30;--shadow:0 3px 18px #0002}
*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:14px/1.5 var(--font)}button,select{font:inherit}button,select{border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);height:36px;padding:0 12px}button{cursor:pointer}button:hover,select:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button.primary{background:var(--ink);color:var(--card);border-color:var(--ink);min-width:86px}button.theme{min-width:82px}button[aria-pressed=true]{background:var(--chip);border-color:var(--accent)}
main{max-width:1440px;margin:auto;padding:32px 36px 24px}.heading{display:flex;align-items:end;justify-content:space-between;gap:18px;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.16em;margin:0 0 8px}h1{font-size:26px;line-height:1.25;letter-spacing:-.04em;margin:0;font-weight:650}.subtitle{color:var(--muted);margin:9px 0 0;font-size:13px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.toolbar label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.toolbar label select{color:var(--ink)}
button.primary[aria-pressed=true]{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--shadow);min-width:0;overflow:hidden}.card-top{padding:19px var(--pad) 0;display:flex;align-items:center;justify-content:space-between;gap:12px}.name{display:flex;align-items:center;gap:10px}h2{margin:0;font-size:16px;font-weight:650}.number{font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}.tag{font-size:10px;color:var(--accent);background:var(--chip);padding:3px 7px;border-radius:5px;white-space:nowrap}.description{margin:5px var(--pad) 0;font-size:12px;color:var(--muted)}.chart{width:100%;height:auto;display:block;overflow:visible;margin:6px 0 0}.gridline{stroke:var(--grid);stroke-width:1}.axis{font:9px var(--font);fill:var(--muted)}.curve{stroke:var(--accent);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}.area{fill:var(--accent);opacity:.045}.anchor{fill:var(--card);stroke:var(--accent);stroke-width:1.4}.readout{font:600 12px var(--font);fill:var(--ink);font-variant-numeric:tabular-nums}
.detail{border-top:1px solid var(--line);margin:0 var(--pad);padding:12px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.detail-label{color:var(--muted);font-size:11px}.detail-value{font-size:12px;margin-top:3px}.large-icon{width:78px;height:54px;display:block;overflow:visible}.note{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 2px 0;color:var(--muted);font-size:11px}.signal{display:flex;align-items:center;gap:6px}.signal i{width:5px;height:5px;border-radius:50%;background:var(--accent)}.baseline .tag{color:var(--muted);background:var(--page)}.baseline{box-shadow:none}.compare-label{color:var(--muted);font-size:10px;letter-spacing:.08em}.size-note{font-variant-numeric:tabular-nums}.marker{pointer-events:none}
@media(min-width:1600px){main{padding-top:44px}.chart{margin-top:14px}}@media(max-width:1090px){main{padding:24px}.heading{align-items:start;flex-direction:column}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:610px){main{padding:22px 14px}.grid{grid-template-columns:1fr;gap:14px}h1{font-size:24px}.toolbar{gap:8px}.toolbar label{gap:5px}.toolbar button,.toolbar select{height:34px;padding:0 9px}.note{align-items:start;flex-direction:column;gap:5px}.card-top{padding-top:16px}}
@media(prefers-reduced-motion:reduce){.motion-hint{display:inline}}
</style>
</head>
<body>
<main x-data="controls" x-init="apply()">
  <header class="heading">
    <div><p class="eyebrow">ARP / LIVE CURVE</p><h1>曲线，也可以有一点性格。</h1><p class="subtitle">五种末端样式，同一条轨迹。看动作，也看它们怎样融入曲线。</p></div>
    <div class="toolbar">
      <label>轨迹<select aria-label="轨迹" x-model="profile" @change="apply()"><option value="wave">起伏</option><option value="rise">爬升</option><option value="stable">平稳</option></select></label>
      <label>尺寸<select aria-label="尺寸" x-model.number="size" @change="apply()"><option value="24">24 px</option><option value="32">32 px</option><option value="40">40 px</option></select></label>
      <button class="theme" @click="dark = !dark; apply()" x-text="dark ? '切换浅色' : '切换深色'">切换深色</button>
      <button class="primary pause" @click="playing = !playing; apply()" :aria-pressed="!playing" x-text="playing ? '暂停' : '继续'">暂停</button>
    </div>
  </header>
  <section class="grid" id="cards" aria-label="曲线末端样式对比"></section>
  <footer class="note"><span class="signal"><i></i><span>中空小圆点标出数据位置 · 右侧为动作放大</span></span><span class="size-note">末端 <span x-text="size">24</span> px · 右侧放大 · <span x-text="playing ? '播放中' : '已暂停'">播放中</span></span></footer>
</main>
<script>
// Standalone design prototype. All samples are generated in memory; no backend or storage.
const entries = [
 {id:'bee',name:'小蜜蜂',tag:'轻快',desc:'薄翼扇动，身体随曲线轻轻转向。',detail:'扇翼 · 触角轻摆',color:'#eab83d'},
 {id:'fish',name:'小鱼',tag:'流畅',desc:'尾鳍交替摆动，像沿水流向前游。',detail:'摆尾 · 胸鳍划水',color:'#56adcd'},
 {id:'pacman',name:'吃豆人',tag:'复古',desc:'嘴巴一开一合，吃着曲线向前走。',detail:'嘴部开合 · 朝向前进方向',color:'#f1c53f'},
 {id:'laser',name:'激光',tag:'光学',desc:'紧凑的亮芯，外侧是一圈柔和光晕。',detail:'亮芯 · 椭圆光斑 · 微弱呼吸',color:'#e95d59'},
 {id:'gecko',name:'小壁虎',tag:'灵动',desc:'四肢交替攀爬，细尾巴顺势弯曲。',detail:'交替迈步 · 尾部摆动',color:'#77a855'},
 {id:'bird',name:'Flappy Bird',tag:'现有样式',desc:'保留像素小鸟，方便比较尺寸与节奏。',detail:'现有像素帧 · 四帧扇翼',color:'#f9d43b'}
];
const cards=document.getElementById('cards');
const xmlns='http://www.w3.org/2000/svg';
function markerArt(id,prefix){
 if(id==='bee') return `<g class="bee-wing-back"><ellipse cx="-5" cy="-7" rx="4.3" ry="7" fill="#d3e8eb" stroke="#72a0a7" stroke-width=".7" transform="rotate(-30 -5 -7)"/></g><path d="M-10 1 -14 2 -10 3" fill="#5d472b"/><ellipse cx="-2" cy="1" rx="9" ry="6.3" fill="#f3c546" stroke="#62492d" stroke-width=".9"/><path d="M-7-4Q-4 1-7 6M-2-5Q1 1-2 7" fill="none" stroke="#62492d" stroke-width="2.4"/><g class="bee-wing"><ellipse cx="-2" cy="-7" rx="4.7" ry="7.8" fill="#e6f5f5" fill-opacity=".95" stroke="#87aeb2" stroke-width=".7" transform="rotate(24 -2 -7)"/><path d="M-2-3 0-11" fill="none" stroke="#b0d1d6" stroke-width=".6"/></g><g class="bee-head"><path d="M6-3 5-9M10-3 12-8" fill="none" stroke="#62492d" stroke-width="1" stroke-linecap="round"/><circle cx="5" cy="-9" r="1" fill="#62492d"/><circle cx="12" cy="-8" r="1" fill="#62492d"/><circle cx="8" cy="0" r="5.5" fill="#f7ce57" stroke="#62492d" stroke-width=".9"/><circle cx="10" cy="-1.5" r="1.1" fill="#332c24"/><circle cx="10.3" cy="-1.9" r=".3" fill="white"/><ellipse cx="11.7" cy="1.1" rx="1.3" ry=".7" fill="#ee9665"/><path d="M9 2Q10 3 11 2" stroke="#62492d" stroke-width=".6" fill="none"/></g>`;
 if(id==='fish') return `<g class="fish-tail"><path d="M-7 0Q-12-5-16-7L-14 0-16 7Q-11 6-7 1" fill="#408ab6" stroke="#2e6c8d" stroke-width=".7"/><path d="M-13-3-8 0-13 3" fill="none" stroke="#8bcee4" stroke-width=".6"/></g><path d="M-3-4Q-3-10 3-8L6-4M-2 4Q0 9 5 6L6 3" fill="#5ba0c0" stroke="#2e6c8d" stroke-width=".6"/><path d="M-10 0Q-3-10 7-5Q13-3 14 0Q12 7 4 6Q-4 6-10 0" fill="#68bbd3" stroke="#2e6c8d" stroke-width=".8"/><path d="M-7 2Q4 9 11 2Q4 5-7 2" fill="#c8e9ec"/><path d="M6-4Q3 0 6 4" stroke="#3b8eab" stroke-width=".7" fill="none"/><g class="fish-fin"><path d="M0 0Q-5 5 0 5L4 1" fill="#3797b7" stroke="#2e6c8d" stroke-width=".6"/></g><circle cx="9" cy="-1.4" r="2.1" fill="#f4f9ef"/><circle cx="9.5" cy="-1.4" r="1" fill="#263f4a"/><path d="M12.5 1 14 1" stroke="#2e6c8d" stroke-width=".7"/>`;
 if(id==='pacman') return `<path class="pacman-body" d="M0 0 10-6A12 12 0 1 0 10 6Z" fill="#f2c83f" stroke="#a98024" stroke-width=".75"/><circle cx="2.2" cy="-6.2" r="1.2" fill="#4e4225"/>`;
 if(id==='laser') return `<defs><radialGradient id="${prefix}-halo"><stop offset="0" stop-color="#ff5149" stop-opacity=".7"/><stop offset=".3" stop-color="#f54c47" stop-opacity=".3"/><stop offset="1" stop-color="#e94b47" stop-opacity="0"/></radialGradient><radialGradient id="${prefix}-core"><stop stop-color="#fff9e7"/><stop offset=".3" stop-color="#ffdbb9"/><stop offset=".6" stop-color="#ff6150"/><stop offset="1" stop-color="#e74943" stop-opacity=".2"/></radialGradient></defs><g class="laser-halo"><ellipse rx="16" ry="11" fill="url(#${prefix}-halo)"/><ellipse rx="8.4" ry="5.6" fill="none" stroke="#ef665b" stroke-opacity=".24" stroke-width=".5"/></g><ellipse rx="5.4" ry="3.7" fill="url(#${prefix}-core)"/><ellipse rx="1.6" ry="1.2" fill="#fff7e4"/>`;
 if(id==='gecko') return `<path class="gecko-tail" d="M-5 1C-13 0-12 9-20 6" fill="none" stroke="#4b743b" stroke-width="3" stroke-linecap="round"/><path class="gecko-tail-inner" d="M-5 1C-13 0-12 9-20 6" fill="none" stroke="#8cb56a" stroke-width="1.7" stroke-linecap="round"/>${[[-5,-1,-1],[5,-1,1],[-5,1,1],[5,1,-1]].map(([x,y,phase],i)=>`<g class="gecko-leg" data-phase="${phase}" data-side="${y}" data-x="${x}"><path d="M${x} ${y} ${x-3} ${y*6} ${x+1} ${y*9}" fill="none" stroke="#547c3e" stroke-width="2" stroke-linecap="round"/><path d="M${x+1} ${y*9} ${x+4} ${y*10}M${x+1} ${y*9} ${x+2} ${y*12}M${x+1} ${y*9} ${x-1} ${y*11}" stroke="#80a45b" stroke-width="1" stroke-linecap="round"/><circle cx="${x+4}" cy="${y*10}" r=".8" fill="#9cbd76"/><circle cx="${x+2}" cy="${y*12}" r=".8" fill="#9cbd76"/></g>`).join('')}<path d="M-10 0Q-5-5 4-3L8-4Q14-4 15 0Q14 4 8 4L4 3Q-5 5-10 0" fill="#88b566" stroke="#4b743b" stroke-width=".8"/><path d="M-7 0Q0-1 7 0" stroke="#b4cd8a" stroke-width="1.3" fill="none" stroke-linecap="round"/><circle cx="10" cy="-3" r="1.9" fill="#bad38d"/><circle cx="10" cy="3" r="1.9" fill="#bad38d"/><circle cx="10.6" cy="-3" r="1" fill="#29372b"/><circle cx="10.6" cy="3" r="1" fill="#29372b"/><path d="M13 0H15" stroke="#4b743b" stroke-width=".6"/>`;
 return '<g class="bird-pixels"></g>';
}
for(const [i,e] of entries.entries()){
 const article=document.createElement('article');article.className='card'+(e.id==='bird'?' baseline':'');article.dataset.marker=e.id;
 article.innerHTML=`<div class="card-top"><div class="name"><span class="number">${e.id==='bird'?'REF':String(i+1).padStart(2,'0')}</span><h2>${e.name}</h2></div><span class="tag">${e.tag}</span></div><p class="description">${e.desc}</p><svg class="chart" viewBox="0 0 400 160" role="img" aria-label="${e.name}曲线效果"><defs><clipPath id="clip-${e.id}"><rect x="36" y="18" width="344" height="106"/></clipPath></defs>${[28,70,112].map((y,j)=>`<path class="gridline" d="M36 ${y}H380"/><text class="axis" x="27" y="${y+3}" text-anchor="end">${[8,6,4][j]}</text>`).join('')}<text class="axis" x="36" y="14">W</text><text class="axis" x="36" y="140">−12 s</text><text class="axis" x="185" y="140">−6 s</text><text class="axis" x="341" y="140" text-anchor="end">现在</text><text class="readout" x="380" y="14" text-anchor="end">6.00 W</text><g clip-path="url(#clip-${e.id})"><path class="area"/><path class="curve"/></g><g class="endpoint"><g class="marker">${markerArt(e.id,e.id+'-chart')}</g><circle class="anchor" r="1.9"/></g></svg><div class="detail"><div><div class="detail-label">动作细节</div><div class="detail-value">${e.detail}</div></div><svg class="large-icon" viewBox="-25 -18 50 36" aria-label="${e.name}动作放大"><g class="marker">${markerArt(e.id,e.id+'-large')}</g></svg></div>`;
 cards.append(article);
}
// The reference uses the same pixel drawing routine as the existing FlappyBirdMarker.
function drawBird(context, x, size, wingOffset) {
  context.save()
  context.translate(x, size / 3)
  context.scale(size / 24, size / 24)
  context.translate(-12, -8)

  context.fillStyle = "#543b2b"
  context.fillRect(7, 0, 9, 1)
  context.fillRect(5, 1, 13, 1)
  context.fillRect(3, 2, 16, 2)
  context.fillRect(2, 4, 18, 2)
  context.fillRect(1, 6, 19, 6)
  context.fillRect(3, 12, 17, 2)
  context.fillRect(5, 14, 13, 1)
  context.fillRect(7, 15, 9, 1)

  context.fillStyle = "#f9d43b"
  context.fillRect(7, 1, 9, 1)
  context.fillRect(5, 2, 13, 1)
  context.fillRect(4, 3, 15, 3)
  context.fillRect(3, 6, 16, 6)
  context.fillRect(4, 12, 13, 2)
  context.fillRect(7, 14, 9, 1)
  context.fillStyle = "#edaa2e"
  context.fillRect(3, 10, 13, 2)
  context.fillRect(4, 12, 13, 2)
  context.fillRect(7, 14, 9, 1)

  context.fillStyle = "#543b2b"
  context.fillRect(12, 2, 5, 1)
  context.fillRect(11, 3, 8, 2)
  context.fillRect(11, 5, 9, 4)
  context.fillRect(13, 9, 6, 1)
  context.fillStyle = "#fffdf2"
  context.fillRect(12, 3, 5, 1)
  context.fillRect(12, 4, 6, 4)
  context.fillRect(14, 8, 5, 1)
  context.fillStyle = "#29221d"
  context.fillRect(16, 4, 2, 4)

  context.save()
  context.translate(0, wingOffset)
  context.fillStyle = "#543b2b"
  context.fillRect(2, 6, 5, 1)
  context.fillRect(1, 7, 7, 4)
  context.fillRect(2, 11, 5, 1)
  context.fillStyle = "#fff2b3"
  context.fillRect(2, 7, 4, 1)
  context.fillRect(2, 8, 5, 2)
  context.fillStyle = "#e7bc54"
  context.fillRect(2, 10, 5, 1)
  context.restore()

  context.fillStyle = "#543b2b"
  context.fillRect(17, 8, 6, 1)
  context.fillRect(16, 9, 8, 4)
  context.fillRect(18, 13, 5, 1)
  context.fillStyle = "#ff9b3d"
  context.fillRect(17, 9, 6, 1)
  context.fillRect(17, 10, 6, 1)
  context.fillStyle = "#f16c34"
  context.fillRect(18, 12, 5, 1)
  context.restore()
}

function loadBirds(){
 for(const group of document.querySelectorAll('.bird-pixels')){
  const frames=[];for(let i=0;i<4;i++){
   const canvas=document.createElement('canvas');canvas.width=96;canvas.height=64;
   const ctx=canvas.getContext('2d');ctx.scale(4,4);drawBird(ctx,12,24,[0,-3,0,3][i]);
   const img=document.createElementNS(xmlns,'image');img.setAttribute('href',canvas.toDataURL());img.setAttribute('x','-12');img.setAttribute('y','-8');img.setAttribute('width','24');img.setAttribute('height','16');img.style.imageRendering='pixelated';img.style.display=i?'none':'';group.append(img);frames.push(img);
  }group._frames=frames;
 }
}
loadBirds();
let settings={playing:!matchMedia('(prefers-reduced-motion: reduce)').matches,dark:new URLSearchParams(location.search).get('state')==='dark',size:24,profile:'wave'};
if(new URLSearchParams(location.search).get('state')==='paused')settings.playing=false;
let time=0,last=0;const cardNodes=[...cards.children];
function sample(t,profile){
 if(profile==='stable')return 6.15+.045*Math.sin(t*2.1)+.025*Math.sin(t*5);
 if(profile==='rise')return 5.5+1.65*Math.sin(t*.12)+.07*Math.sin(t*1.3);
 return 6.1+1.05*Math.sin(t*.66)+.25*Math.sin(t*1.85)+.09*Math.cos(t*4.1);
}
const resizeObserver=new ResizeObserver(entries=>{for(const entry of entries){entry.target.closest('.card')._chartScale=entry.contentRect.width/400}draw()});
cardNodes.forEach(card=>resizeObserver.observe(card.querySelector('.chart')));
function position(t){return 70-(sample(t,settings.profile)-6)*21}
function setTransform(root,selector,value){const n=root.querySelector(selector);if(n)n.setAttribute('transform',value)}
function animateArt(root,id,t){
 if(id==='bee'){
  const a=Math.sin(t*2*Math.PI*9);setTransform(root,'.bee-wing',`translate(0 -3) scale(1 ${.6+.35*a}) translate(0 3)`);setTransform(root,'.bee-wing-back',`scale(1 ${.7-.25*a})`);setTransform(root,'.bee-head',`rotate(${Math.sin(t*5)*2} 6 0)`);
 }else if(id==='fish'){
  setTransform(root,'.fish-tail',`translate(-8 0) scale(${.75+.25*Math.sin(t*10)} 1) translate(8 0)`);setTransform(root,'.fish-fin',`rotate(${Math.sin(t*10+1)*18} 2 1)`);
 }else if(id==='pacman'){
  const a=.08+.5*(.5+.5*Math.sin(t*12)),x=12*Math.cos(a),y=12*Math.sin(a);
  root.querySelector('.pacman-body').setAttribute('d',`M0 0L${x} ${-y}A12 12 0 1 0 ${x} ${y}Z`);
 }else if(id==='laser'){
  const pulse=.96+.04*Math.sin(t*4);setTransform(root,'.laser-halo',`scale(${pulse})`);root.querySelector('.laser-halo').setAttribute('opacity',String(.88+.12*Math.sin(t*4)));
 }else if(id==='gecko'){
  root.querySelectorAll('.gecko-leg').forEach(n=>n.setAttribute('transform',`rotate(${Math.sin(t*8)*15*Number(n.dataset.phase)} ${n.dataset.x} 0)`));
  const s=Math.sin(t*5),d=`M-5 1C-12 ${s*3}-13 ${7+s*2}-20 ${5-s*4}`;root.querySelector('.gecko-tail').setAttribute('d',d);root.querySelector('.gecko-tail-inner').setAttribute('d',d);
 }else if(id==='bird')root.querySelector('.bird-pixels')._frames.forEach((n,i)=>n.style.display=i===Math.floor(t*10)%4?'':'none');
}
function draw(){
 const now=time+15,y=position(now),slope=(position(now+.02)-position(now-.02))/.04/25;
 const angle=Math.max(-26,Math.min(26,Math.atan(slope)*180/Math.PI));
 const points=[];for(let i=0;i<=240;i++){const x=36+i/240*305,t=now-12+i/240*12;points.push(`${x.toFixed(2)} ${position(t).toFixed(2)}`)}
 const path='M'+points.join('L'),value=sample(now,settings.profile).toFixed(2)+' W';
 cardNodes.forEach((card,i)=>{
  const id=entries[i].id;card.querySelector('.curve').setAttribute('d',path);card.querySelector('.area').setAttribute('d',path+'L341 124L36 124Z');card.querySelector('.endpoint').setAttribute('transform',`translate(341 ${y})`);
  card.querySelector('.endpoint .marker').setAttribute('transform',`rotate(${id==='laser'?0:angle}) scale(${settings.size/24/(card._chartScale||1)})`);
  card.querySelector('.readout').textContent=value;animateArt(card.querySelector('.chart .marker'),id,time);animateArt(card.querySelector('.large-icon .marker'),id,time);
 });
}
function loop(timestamp){if(last&&settings.playing&&!document.hidden)time+=Math.min((timestamp-last)/1000,.06);last=timestamp;if(settings.playing&&!document.hidden)draw();requestAnimationFrame(loop)}
document.addEventListener('visibilitychange',()=>last=0);
document.addEventListener('alpine:init',()=>Alpine.data('controls',()=>({...settings,apply(){settings={playing:this.playing,dark:this.dark,size:Number(this.size),profile:this.profile};document.documentElement.dataset.theme=this.dark?'dark':'light';draw()}})));
draw();requestAnimationFrame(loop);
</script>
<script defer src="vendor/alpine.min.js"></script>
</body>
</html>
