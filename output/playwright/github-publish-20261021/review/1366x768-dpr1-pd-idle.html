          root.dataset.theme = theme
          const storedAccent = localStorage.getItem("power-test.accent-theme")
          root.dataset.accent = ["orange", "blue", "green", "purple", "rose", "graphite"].includes(storedAccent) ? storedAccent : "orange"
          root.style.background = theme === "dark" ? "#0f1112" : "#f4f6f8"
          root.style.colorScheme = theme
          document.querySelector('meta[name="theme-color"]')?.setAttribute("content", root.style.background)
        } catch {
          // Use the dark default when local storage is unavailable.
        }
      })()
    </script>
  

</body></html>
