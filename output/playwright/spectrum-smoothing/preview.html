<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="rose">
<head><meta charset="UTF-8"><title>光谱平滑连接对比</title></head>
<body><main id="root"></main>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {CanvasLineChart} from '/src/components/canvas-line-chart.tsx';
import '/src/index.css';
const data = Array.from({length: 188}, (_, i) => {
  const x = 420.1 + i * 0.267;
  const width = x < 450.2 ? 0.65 : 0.46;
  return {wavelengthNm: x, intensity: 660 * Math.exp(-0.5 * ((x - 450.2) / width) ** 2) + 3 * Math.sin(i * 2.1)};
});
function plot(label, interpolation, domain, height) {
  return React.createElement('section', {style: {background:'#fff',padding:'16px',border:'1px solid #dde1e6',borderRadius:12}},
    React.createElement('h2', {style:{fontSize:16,margin:'0 0 8px'}}, label),
    React.createElement('div', {style:{height}}, React.createElement(CanvasLineChart, {
      data, xKey:'wavelengthNm', xDomain:domain, yDomain:[-200,800],
      xTickSuffix:' nm', preserveAllPoints:true, ariaLabel:label,
      lines:[{key:'intensity',label:'光谱',color:'#b94469',interpolation}]
    })));
}
createRoot(document.getElementById('root')).render(React.createElement('div', {style:{padding:24,display:'grid',gap:16}},
  React.createElement('header',null,React.createElement('h1',{style:{fontSize:24,fontWeight:600}},'光谱连接效果对比'),React.createElement('p',{style:{color:'#777'}},'同一组模拟采样数据 · 每个采样点保持不变')),
  plot('调整前 · 直线连接', 'linear', [420,470], 235),
  plot('调整后 · 保形平滑连接', 'monotone', [420,470], 235),
  React.createElement('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}},
    plot('峰顶局部 · 调整前','linear',[448,452],210),plot('峰顶局部 · 调整后','monotone',[448,452],210))));
</script></body></html>
