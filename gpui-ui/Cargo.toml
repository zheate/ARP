[package]
name = "arp-gpui"
version = "0.1.2"
edition = "2024"
description = "Power Test native GPUI operator application"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:rfd"]

[[bin]]
name = "arp-gpui"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
gpui-kit = { version = "=0.9.0", optional = true }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = "2"
sha2 = "0.10"
dirs = "6"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
ctrlc = "3.5"

[patch.crates-io]
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
